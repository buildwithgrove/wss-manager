name: Lint, Unit Test and Push to Google Artifact Registry

on:
  push:
    branches: [main]

env:
  PROJECT_ID: portal-gb-prod
  REGISTRY: us-central1-docker.pkg.dev
  IMAGE: wss-manager
  REPOSITORY: wss-manager

jobs:
  golangci-lint:
    name: Run golangci-lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.22

      - name: Setup Git Authentication
        run: |
          git config --global url."https://${{ secrets.POKT_BOT_GITHUB_TOKEN }}:x-oauth-basic@github.com/".insteadOf "https://github.com/"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout 10m --verbose

  gocritic:
    name: Run gocritic
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.22

      - name: Setup Git Authentication
        run: |
          git config --global url."https://${{ secrets.POKT_BOT_GITHUB_TOKEN }}:x-oauth-basic@github.com/".insteadOf "https://github.com/"

      - name: gocritic
        run: |
          go install github.com/go-critic/go-critic/cmd/gocritic@v0.11.2
          gocritic check -disable=sloppyTypeAssert ./...

  test:
    name: Run unit tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.22

      - name: Setup Git Authentication
        run: |
          git config --global url."https://${{ secrets.POKT_BOT_GITHUB_TOKEN }}:x-oauth-basic@github.com/".insteadOf "https://github.com/"

      - name: unit tests
        run: CGO_ENABLED=0 go test ./... -short

  test-docker-build:
    name: Test build of Docker image
    runs-on: ubuntu-22.04
    steps:
      - uses: docker/build-push-action@v2
        with:
          build-args: |
            IMAGE_TAG=test
            GITHUB_TOKEN=${{ secrets.POKT_BOT_GITHUB_TOKEN }}
          push: false
          load: true
          tags: test-build

  tag:
    name: Semantic Release Tag
    runs-on: ubuntu-22.04
    needs: [golangci-lint, gocritic, test, test-docker-build]
    outputs:
      new: ${{ steps.semantic.outputs.new-release-published }}
      version: ${{ steps.semantic.outputs.release-version }}

    steps:
      - uses: actions/checkout@v3

      - name: Tag Semantic Release Version
        id: semantic
        uses: codfish/semantic-release-action@v3
        with:
          branches: |
            [
              'main',
              {
                name: 'dev',
                prerelease: 'dev'
              }
            ]
          tag-format: "v${version}"
          additional-packages: |
            ['@semantic-release/commit-analyzer']
          plugins: |
            ['@semantic-release/commit-analyzer']

  push:
    if: needs.tag.outputs.new == 'true'
    runs-on: ubuntu-latest
    needs: [golangci-lint, gocritic, test, test-docker-build, tag]

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v0.6.0"
        with:
          credentials_json: "${{ secrets.GCP_CREDENTIALS }}"
          token_format: "access_token"

      - name: Login to Google Artifact Registry
        uses: docker/login-action@v2
        with:
          registry: "${{ env.REGISTRY }}"
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push
        uses: docker/build-push-action@v3
        with:
          build-args: |
            IMAGE_TAG=${{ needs.tag.outputs.version }}
            GITHUB_TOKEN=${{ secrets.GH_ACCESS_TOKEN }}
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ needs.tag.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest
